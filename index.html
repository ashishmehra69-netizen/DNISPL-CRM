<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales CRM - Simple Version</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: white; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; padding: 30px 0; }
    .header h1 { font-size: 2.5em; margin-bottom: 10px; }
    .login-box { background: rgba(255,255,255,0.15); padding: 40px; border-radius: 15px; max-width: 420px; margin: 40px auto; text-align: center; }
    .input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 1em; }
    textarea { min-height: 80px; }
    .btn { background: white; color: #667eea; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 6px 4px; font-size: 1em; }
    .btn:hover { transform: translateY(-1px); transition: all 0.2s; }
    .btn-success { background: #4ade80; color: white; }
    .btn-danger { background: #ff4757; color: white; }
    .tabs { display: flex; gap: 10px; margin: 20px 0; overflow-x: auto; }
    .tab { padding: 12px 20px; background: rgba(255,255,255,0.12); border: none; color: white; cursor: pointer; border-radius: 8px; white-space: nowrap; }
    .tab.active { background: white; color: #667eea; font-weight: bold; }
    .card { background: rgba(255,255,255,0.15); padding: 18px; border-radius: 12px; margin: 14px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 16px 0; }
    .item-card { background: rgba(255,255,255,0.1); padding: 14px; border-radius: 10px; cursor: pointer; }
    .item-card:hover { background: rgba(255,255,255,0.2); }
    .status { text-align: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; margin: 10px 0; }
    .tag { display: inline-block; padding: 4px 10px; background: rgba(255,255,255,0.2); border-radius: 12px; font-size: 0.85em; margin: 3px; }
    .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: white; color: #667eea; border: none; border-radius: 50%; font-size: 2em; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; overflow-y: auto; padding: 20px; }
    .modal.show { display: block; }
    .modal-content { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 24px; border-radius: 14px; max-width: 680px; margin: 20px auto; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Sales CRM</h1>
      <p>Simple & Reliable</p>
    </div>

    <div id="loginScreen" style="display:block">
      <div class="login-box">
        <h2 style="margin-bottom:20px">Sign In</h2>
        <input type="email" class="input" id="emailInput" placeholder="Your Email" />
        <input type="password" class="input" id="passwordInput" placeholder="Password" value="crm2026" />
        <button class="btn btn-success" onclick="login()">Sign In</button>
        <div style="margin-top:18px; font-size:0.9em; opacity:0.85">
          Password: crm2026<br />
          Supervisor: ashish.mehra@dnispl.com
        </div>
      </div>
    </div>

    <div id="mainScreen" style="display:none">
      <div class="status" id="status">Loading...</div>
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap">
          <div>👤 <strong id="userEmail"></strong> <span class="tag" id="userRole"></span></div>
          <div id="userActions" class="row">
            <button class="btn" onclick="logout()">Logout</button>
          </div>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="content"></div>
    </div>
  </div>

  <button class="fab" id="fabBtn" onclick="openAddModal()" style="display:none">+</button>
  <div class="modal" id="modal"></div>

  <script>
    const SUPERVISOR_EMAIL = 'ashish.mehra@dnispl.com';
    const PASSWORD = 'crm2026';
    const PRESALES_OWNER = 'vinod.v@dnispl.com';
    const PURCHASE_OWNER = 'narendra.singh@dnispl.com';
    const CRM_API_BASE = '';
    const BUILD_VERSION = '2026-03-24-clean-01';

    const OPPORTUNITY_INTAKE_REQUIRED_FIELDS = [
      { key: 'intakeProblemStatement', label: 'Problem Statement' },
      { key: 'intakeWhyNow', label: 'Why Now (Trigger Event)' },
      { key: 'intakeBusinessImpact', label: 'Business Impact' },
      { key: 'intakeCurrentState', label: 'Current State Summary' },
      { key: 'intakeBudgetRange', label: 'Budget Range' },
      { key: 'intakeDecisionTimeline', label: 'Decision Timeline' }
    ];

    let currentUser = '';
    let isSupervisor = false;
    let slaTimer = null;

    const state = {
      activeTab: 'leads',
      data: { leads: [], accounts: [], contacts: [], opportunities: [], activities: [] }
    };

    function normalizeEmail(v) { return String(v || '').trim().toLowerCase(); }
    function getViewerRoleForApi() { return isSupervisor ? 'supervisor' : 'account_manager'; }
    function fmtDate(v) { const d = new Date(v); return isNaN(d.getTime()) ? 'NA' : d.toLocaleDateString(); }
    function fmtDateTime(v) { const d = new Date(v); return isNaN(d.getTime()) ? 'NA' : d.toLocaleString(); }
    function toISOOrBlank(v) { if (!v) return ''; const d = new Date(v); return isNaN(d.getTime()) ? '' : d.toISOString(); }
    function addHours(baseIso, hours) { const d = baseIso ? new Date(baseIso) : new Date(); d.setHours(d.getHours() + hours); return d.toISOString(); }

    function getUserRole() {
      if (isSupervisor) return 'supervisor';
      const e = normalizeEmail(currentUser);
      if (e.includes('presales') || e.includes('solutions')) return 'presales';
      if (e.includes('purchase') || e.includes('procurement')) return 'purchase';
      return 'sales';
    }

    function getWinProbSafe(opp) {
      const stageProb = { Discovery: 25, Proposal: 60, Negotiation: 85, 'Closed Won': 100, 'Closed Lost': 0 };
      return stageProb[opp.stage] || 25;
    }

    function getTeamUsers(role) {
      if (role === 'sales') {
        const users = new Set();
        state.data.leads.forEach(x => x.owner && users.add(x.owner));
        state.data.accounts.forEach(x => x.owner && users.add(x.owner));
        state.data.contacts.forEach(x => x.owner && users.add(x.owner));
        state.data.opportunities.forEach(x => x.owner && users.add(x.owner));
        users.add('rakesh.uniyal@dnispl.com');
        users.add(currentUser || 'sales@company.com');
        return Array.from(users);
      }
      if (role === 'presales') return [PRESALES_OWNER];
      if (role === 'purchase') return [PURCHASE_OWNER];
      return [];
    }

    async function fetchApi(path) {
      const url = `${CRM_API_BASE}${path}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${path} failed (${r.status})`);
      return r.json();
    }

    async function postApi(path, body) {
      const r = await fetch(`${CRM_API_BASE}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error(await r.text() || `${path} failed (${r.status})`);
      return r.json();
    }

    async function deleteApi(path) {
      const r = await fetch(`${CRM_API_BASE}${path}`, { method: 'DELETE' });
      if (!r.ok) throw new Error(await r.text() || `${path} failed (${r.status})`);
      return r.json();
    }

    async function fetchUserPassword(email) {
      try {
        return (await fetchApi(`/api/passwords/${encodeURIComponent(email)}?viewer_email=${encodeURIComponent(email)}&viewer_role=account_manager`)).password || null;
      } catch (_) { return null; }
    }

    async function setUserPassword(email, password) {
      return postApi('/api/passwords', { email, password, viewer_email: currentUser, viewer_role: 'account_manager' });
    }

    async function login() {
      const email = normalizeEmail(document.getElementById('emailInput').value);
      const password = document.getElementById('passwordInput').value;
      const loginBtn = document.querySelector('#loginScreen .btn.btn-success');
      if (!email) return alert('Please enter your email');

      if (loginBtn) { loginBtn.disabled = true; loginBtn.textContent = 'Signing In...'; }

      let expected = PASSWORD;
      try { const p = await fetchUserPassword(email); if (p) expected = p; } catch (_) {}

      if (password !== expected) {
        if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = 'Sign In'; }
        return alert('Incorrect password');
      }

      currentUser = email;
      isSupervisor = email === normalizeEmail(SUPERVISOR_EMAIL);

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';
      document.getElementById('fabBtn').style.display = 'block';
      document.getElementById('userEmail').textContent = currentUser;

      const roleLabel = { supervisor: 'SUPERVISOR', sales: 'SALESPERSON', presales: 'PRESALES', purchase: 'PURCHASE' };
      document.getElementById('userRole').textContent = roleLabel[getUserRole()] || 'SALESPERSON';

      const actions = document.getElementById('userActions');
      if (actions && !document.getElementById('changePwdBtn')) {
        const btn = document.createElement('button');
        btn.id = 'changePwdBtn'; btn.className = 'btn'; btn.textContent = 'Change Password';
        btn.onclick = async () => {
          const pwd = prompt('Enter your new password:');
          if (!pwd) return;
          try { await setUserPassword(currentUser, pwd); alert('Password updated'); }
          catch (e) { alert(`Failed: ${e.message}`); }
        };
        actions.insertBefore(btn, actions.firstChild);
      }

      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.textContent = 'Loading data...';

      try {
        await loadData();
      } catch (err) {
        console.error(err);
        alert('Signed in, but data loading failed. Please refresh once.');
      } finally {
        if (slaTimer) clearInterval(slaTimer);
        slaTimer = setInterval(runSLAEngine, 60000);
        if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = 'Sign In'; }
      }
    }

    function logout() {
      currentUser = '';
      isSupervisor = false;
      if (slaTimer) { clearInterval(slaTimer); slaTimer = null; }
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('mainScreen').style.display = 'none';
      document.getElementById('fabBtn').style.display = 'none';
    }

    function normalizeArray(arr) { return Array.isArray(arr) ? arr : []; }

    async function loadData() {
      const vr = getViewerRoleForApi();
      const ve = encodeURIComponent(currentUser);

      const [acc, act, lead, con, opp] = await Promise.allSettled([
        fetchApi(`/api/accounts?viewer_email=${ve}&viewer_role=${vr}`),
        fetchApi(`/api/activities?viewer_email=${ve}&viewer_role=${vr}`),
        fetchApi(`/api/leads?viewer_email=${ve}&viewer_role=${vr}`),
        fetchApi(`/api/contacts?viewer_email=${ve}&viewer_role=${vr}`),
        fetchApi(`/api/opportunities?viewer_email=${ve}&viewer_role=${vr}`)
      ]);

      state.data.accounts = acc.status === 'fulfilled' ? normalizeArray(acc.value) : [];
      state.data.activities = act.status === 'fulfilled' ? normalizeArray(act.value) : [];
      state.data.leads = lead.status === 'fulfilled' ? normalizeArray(lead.value) : [];
      state.data.contacts = con.status === 'fulfilled' ? normalizeArray(con.value) : [];
      state.data.opportunities = opp.status === 'fulfilled' ? normalizeArray(opp.value) : [];

      document.getElementById('status').textContent = `${isSupervisor ? '✅ Supervisor View - ALL Data' : '✅ Your Data'} | Build ${BUILD_VERSION}`;
      render();
    }

    function filteredData() {
      if (isSupervisor) return state.data;
      const me = normalizeEmail(currentUser);
      const role = getUserRole();
      const accountIds = new Set(state.data.accounts
        .filter(a => normalizeEmail(a.account_manager_email || a.accountManager || a.owner) === me)
        .map(a => String(a.id)));

      return {
        leads: state.data.leads.filter(x => normalizeEmail(x.owner) === me),
        accounts: state.data.accounts.filter(a => accountIds.has(String(a.id))),
        contacts: state.data.contacts.filter(x => normalizeEmail(x.owner) === me || accountIds.has(String(x.account_id || x.accountId))),
        opportunities: state.data.opportunities.filter(o => {
          const aid = String(o.account_id || o.accountId || '');
          if (normalizeEmail(o.owner) === me) return true;
          if (accountIds.has(aid)) return true;
          if (role === 'presales') return normalizeEmail(o.assigned_presales || o.assignedPresales) === me;
          if (role === 'purchase') return normalizeEmail(o.assigned_purchase || o.assignedPurchase) === me;
          return false;
        }),
        activities: state.data.activities.filter(x => normalizeEmail(x.owner) === me)
      };
    }

    function changeTab(tab) { state.activeTab = tab; render(); }

    function render() {
      const role = getUserRole();
      const tabs = isSupervisor
        ? ['leads', 'accounts', 'contacts', 'opportunities', 'workflow', 'activities', 'dashboard']
        : (role === 'sales' ? ['leads', 'accounts', 'contacts', 'opportunities', 'workflow', 'activities'] : ['opportunities', 'workflow', 'activities']);
      if (!tabs.includes(state.activeTab)) state.activeTab = tabs[0];

      document.getElementById('tabs').innerHTML = tabs
        .map(t => `<button class="tab ${state.activeTab === t ? 'active' : ''}" onclick="changeTab('${t}')">${t.toUpperCase()}</button>`)
        .join('');

      const d = filteredData();
      if (state.activeTab === 'leads') return renderLeads(d);
      if (state.activeTab === 'accounts') return renderAccounts(d);
      if (state.activeTab === 'contacts') return renderContacts(d);
      if (state.activeTab === 'opportunities') return renderOpportunities(d);
      if (state.activeTab === 'workflow') return renderWorkflow(d);
      if (state.activeTab === 'activities') return renderActivities(d);
      renderDashboard(d);
    }

    function renderLeads(d) {
      document.getElementById('content').innerHTML = `<div class="card"><h2>🎯 Leads (${d.leads.length})</h2></div><div class="grid">${d.leads.map(l => `<div class="item-card"><h3>${l.name || ''}</h3><div>${l.company || ''}</div><div class="tag">${l.status || 'New'}</div></div>`).join('') || '<div class="card">No leads yet.</div>'}</div>`;
    }

    function renderAccounts(d) {
      document.getElementById('content').innerHTML = `<div class="card"><h2>🏢 Accounts (${d.accounts.length})</h2></div><div class="grid">${d.accounts.map(a => `<div class="item-card"><h3>${a.account_name || a.name || ''}</h3><div>${a.industry || ''}</div><div class="tag">${a.location || ''}</div></div>`).join('') || '<div class="card">No accounts yet.</div>'}</div>`;
    }

    function renderContacts(d) {
      document.getElementById('content').innerHTML = `<div class="card"><h2>👥 Contacts (${d.contacts.length})</h2></div><div class="grid">${d.contacts.map(c => `<div class="item-card"><h3>${c.name || ''}</h3><div>${c.title || ''}</div><div class="tag">${c.email || ''}</div></div>`).join('') || '<div class="card">No contacts yet.</div>'}</div>`;
    }

    function renderOpportunities(d) {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <h2>💰 Opportunities (${d.opportunities.length})</h2>
          <button class="btn btn-success" onclick="openOpportunityModal()">Add Opportunity</button>
        </div>
        <div class="grid">
          ${d.opportunities.map(o => {
            const p = getWinProbSafe(o);
            return `<div class="item-card" onclick="openOpportunityModal('${o.id}')"><h3>${o.name || ''}</h3><div style="color:#4ade80;font-weight:bold">₹${Number(o.value || 0).toLocaleString('en-IN')}</div><div><span class="tag">${o.stage || 'Discovery'}</span><span class="tag">${o.workflow_stage || o.workflowStage || 'Sales Review'}</span><span class="tag">Win ${p}%</span></div><div style="margin-top:6px;font-size:0.9em">Presales: ${(o.assigned_presales || o.assignedPresales || 'Unassigned')}</div></div>`;
          }).join('') || '<div class="card">No opportunities yet.</div>'}
        </div>`;
    }

    function renderWorkflow(d) {
      document.getElementById('content').innerHTML = `<div class="card"><h2>🔄 Workflow (${d.opportunities.length})</h2></div><div class="grid">${d.opportunities.map(o => `<div class="item-card"><h3>${o.name || ''}</h3><div class="tag">${o.workflow_stage || o.workflowStage || 'Sales Review'}</div><div>Presales: ${o.assigned_presales || o.assignedPresales || 'Unassigned'}</div><div>Purchase: ${o.assigned_purchase || o.assignedPurchase || 'Unassigned'}</div></div>`).join('') || '<div class="card">No workflow items.</div>'}</div>`;
    }

    function renderActivities(d) {
      document.getElementById('content').innerHTML = `<div class="card"><h2>📝 Activities (${d.activities.length})</h2></div><div class="grid">${d.activities.map(a => `<div class="item-card"><h3>${a.type || 'Note'}</h3><div>${a.subject || ''}</div><div class="tag">${fmtDateTime(a.date || a.created_at || a.createdDate)}</div></div>`).join('') || '<div class="card">No activities yet.</div>'}</div>`;
    }

    function renderDashboard(d) {
      const total = d.opportunities.reduce((s, o) => s + Number(o.value || 0), 0);
      document.getElementById('content').innerHTML = `<div class="card"><h2>📊 Dashboard</h2></div><div class="grid"><div class="item-card"><h3>Leads</h3><div>${d.leads.length}</div></div><div class="item-card"><h3>Accounts</h3><div>${d.accounts.length}</div></div><div class="item-card"><h3>Contacts</h3><div>${d.contacts.length}</div></div><div class="item-card"><h3>Opportunities</h3><div>${d.opportunities.length}</div></div><div class="item-card"><h3>Pipeline</h3><div>₹${total.toLocaleString('en-IN')}</div></div></div>`;
    }

    function openAddModal() {
      if (state.activeTab === 'opportunities' || state.activeTab === 'workflow') return openOpportunityModal();
      alert('Use Opportunities tab to add new opportunity in this clean build.');
    }

    function getOppById(id) {
      return state.data.opportunities.find(o => String(o.id) === String(id));
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    function openOpportunityModal(id = null) {
      const opp = id ? getOppById(id) : null;
      const accountOptions = filteredData().accounts
        .map(a => `<option value="${a.id}" ${String(opp?.account_id || opp?.accountId || '') === String(a.id) ? 'selected' : ''}>${a.account_name || a.name}</option>`)
        .join('');

      document.getElementById('modal').innerHTML = `
        <div class="modal-content">
          <h2>${opp ? 'Edit' : 'Add'} Opportunity</h2>
          <form onsubmit="saveOpportunity(event, ${opp ? `'${opp.id}'` : 'null'})">
            <input class="input" required name="name" placeholder="Opportunity Name *" value="${opp?.name || ''}" />
            <select class="input" required name="accountId"><option value="">Select Account *</option>${accountOptions}</select>
            <input class="input" required type="number" name="value" placeholder="Value (₹) *" value="${opp?.value || ''}" />
            <select class="input" required name="stage">
              <option value="Discovery" ${opp?.stage === 'Discovery' ? 'selected' : ''}>Discovery</option>
              <option value="Proposal" ${opp?.stage === 'Proposal' ? 'selected' : ''}>Proposal</option>
              <option value="Negotiation" ${opp?.stage === 'Negotiation' ? 'selected' : ''}>Negotiation</option>
              <option value="Closed Won" ${opp?.stage === 'Closed Won' ? 'selected' : ''}>Closed Won</option>
              <option value="Closed Lost" ${opp?.stage === 'Closed Lost' ? 'selected' : ''}>Closed Lost</option>
            </select>
            <select class="input" name="assignedPresales"><option value="">Assign Presales</option>${getTeamUsers('presales').map(u => `<option value="${u}" ${u === (opp?.assigned_presales || opp?.assignedPresales || '') ? 'selected' : ''}>${u}</option>`).join('')}</select>
            <select class="input" name="assignedPurchase"><option value="">Assign Purchase</option>${getTeamUsers('purchase').map(u => `<option value="${u}" ${u === (opp?.assigned_purchase || opp?.assignedPurchase || '') ? 'selected' : ''}>${u}</option>`).join('')}</select>
            <textarea required name="intakeProblemStatement" placeholder="Problem Statement *">${opp?.intake_problem_statement || opp?.intakeProblemStatement || ''}</textarea>
            <textarea required name="intakeWhyNow" placeholder="Why Now *">${opp?.intake_why_now || opp?.intakeWhyNow || ''}</textarea>
            <textarea required name="intakeBusinessImpact" placeholder="Business Impact *">${opp?.intake_business_impact || opp?.intakeBusinessImpact || ''}</textarea>
            <textarea required name="intakeCurrentState" placeholder="Current State *">${opp?.intake_current_state || opp?.intakeCurrentState || ''}</textarea>
            <textarea required name="intakeBudgetRange" placeholder="Budget Range *">${opp?.intake_budget_range || opp?.intakeBudgetRange || ''}</textarea>
            <textarea required name="intakeDecisionTimeline" placeholder="Decision Timeline *">${opp?.intake_decision_timeline || opp?.intakeDecisionTimeline || ''}</textarea>
            <div class="row" style="margin-top:12px">
              <button type="button" class="btn" onclick="closeModal()">Cancel</button>
              <button type="submit" class="btn btn-success">Save</button>
              ${opp ? `<button type="button" class="btn btn-danger" onclick="deleteOpportunity('${opp.id}')">Delete</button>` : ''}
            </div>
          </form>
        </div>`;
      document.getElementById('modal').classList.add('show');
    }

    async function saveOpportunity(e, id) {
      e.preventDefault();
      const existing = id ? getOppById(id) : null;
      const nowIso = new Date().toISOString();
      const data = Object.fromEntries(new FormData(e.target));

      const missing = OPPORTUNITY_INTAKE_REQUIRED_FIELDS
        .filter(f => !String(data[f.key] || '').trim())
        .map(f => f.label);
      if (missing.length) return alert('Please fill mandatory fields:\n- ' + missing.join('\n- '));

      const payload = {
        id: id || undefined,
        name: data.name,
        accountId: data.accountId,
        value: Number(data.value || 0),
        stage: data.stage || 'Discovery',
        owner: existing?.owner || currentUser,
        salesOwner: existing?.salesOwner || currentUser,
        workflowStage: existing?.workflowStage || 'Sales Review',
        assignedPresales: data.assignedPresales || existing?.assignedPresales || PRESALES_OWNER,
        assignedPurchase: data.assignedPurchase || existing?.assignedPurchase || '',
        intakeProblemStatement: data.intakeProblemStatement,
        intakeWhyNow: data.intakeWhyNow,
        intakeBusinessImpact: data.intakeBusinessImpact,
        intakeCurrentState: data.intakeCurrentState,
        intakeBudgetRange: data.intakeBudgetRange,
        intakeDecisionTimeline: data.intakeDecisionTimeline,
        createdDate: existing?.createdDate || nowIso,
        modifiedDate: nowIso,
        salesSubmittedAt: existing?.salesSubmittedAt || nowIso,
        assignmentDueAt: existing?.assignmentDueAt || addHours(nowIso, 4),
        presalesDueAt: existing?.presalesDueAt || addHours(nowIso, 72)
      };

      try {
        await postApi('/api/opportunities', payload);
        await loadData();
        closeModal();
      } catch (err) {
        alert(`Could not save opportunity: ${err.message}`);
      }
    }

    async function deleteOpportunity(id) {
      if (!confirm('Delete this opportunity?')) return;
      try {
        await deleteApi(`/api/opportunities/${encodeURIComponent(id)}?viewer_email=${encodeURIComponent(currentUser)}&viewer_role=${encodeURIComponent(getViewerRoleForApi())}`);
        await loadData();
        closeModal();
      } catch (err) {
